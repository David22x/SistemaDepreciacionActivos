$kind: http-request
order: 3000
method: GET
url: '{{baseUrl}}/auth/validar'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Token válido (200)", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Respuesta contiene mensaje y usuario", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("mensaje");
          pm.expect(json).to.have.property("usuario");
      });
