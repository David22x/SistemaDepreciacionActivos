$kind: collection
name: SistemaDepreciacionActivos
description: |-
  Colección completa para probar el backend del Sistema de Depreciación de Activos.
  Cubre todos los microservicios: Auth, Activos, Categorías, Depreciación y Reportes.

  Variables requeridas (entorno "Depreciacion Local"):
  - baseUrl: URL base del Gateway, ej. http://localhost:5138
  - token: JWT que se guarda automáticamente al hacer login
  - activoID: ID del activo a usar en las pruebas
variables:
  - key: baseUrl
    value: 'http://localhost:5138'
    description: 'URL base del API Gateway (Ocelot)'
  - key: token
    value: ''
    description: 'JWT Bearer token (se llena automáticamente con el login)'
  - key: activoID
    value: '1'
    description: 'ID del activo para pruebas de GET/PUT/DELETE'
