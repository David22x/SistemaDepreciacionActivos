$kind: http-request
name: 'POST Calcular Depreciación con Fecha Específica'
order: 2000
method: POST
url: '{{baseUrl}}/depreciation/calcular'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "ActivoId": {{activoID}},
      "FechaConsulta": "2025-12-31T00:00:00Z",
      "FechaAdquisicion": "2024-01-15T00:00:00Z"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Depreciación calculada (200)", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Respuesta contiene desglose por año", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("desglosePorAnio");
          pm.expect(json.desglosePorAnio).to.be.an("array");
      });
