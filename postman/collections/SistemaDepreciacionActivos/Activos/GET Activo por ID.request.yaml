$kind: http-request
order: 2000
method: GET
url: '{{baseUrl}}/assets/{{activoID}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Activo encontrado (200)", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Respuesta contiene campos requeridos", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("nombre");
          pm.expect(json).to.have.property("valorOriginal");
          pm.expect(json).to.have.property("categoriaId");
      });
