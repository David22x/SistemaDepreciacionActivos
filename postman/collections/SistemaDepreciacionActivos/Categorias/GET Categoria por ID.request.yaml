$kind: http-request
name: 'GET Categoría por ID'
order: 2000
method: GET
url: '{{baseUrl}}/assets/categorias/1'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Categoría encontrada (200)", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Respuesta contiene campos requeridos", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("nombre");
          pm.expect(json).to.have.property("vidaUtilMeses");
      });
